[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textutils"
version = "0.1.0"
description = "Small standard-library string helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[tool.setuptools]
packages = ["textutils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
